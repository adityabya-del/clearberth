<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ClearBerth — Train Seat Availability</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F7F8FC;
    color: #14142B;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    text-align: center;
  }
  .logo {
    display: inline-block;
    background: #3654FF;
    color: #fff;
    font-weight: 700;
    font-size: 28px;
    padding: 16px 28px;
    border-radius: 20px;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 32px;
    margin-bottom: 12px;
  }
  p {
    font-size: 16px;
    color: #6E7191;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .badge {
    display: inline-block;
    background: #EEF0FA;
    color: #3654FF;
    font-weight: 600;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">ClearBerth</div>
    <h1>Check train seat availability, instantly.</h1>
    <p>ClearBerth helps you find open berths across classes and quotas for Indian Railways trains — fast, simple, and free to search.</p>
    <div class="badge">Coming soon</div>
  </div>
</body>
</html>
